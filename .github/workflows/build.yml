name: Build iOS App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build App (unsigned)
        run: |
          xcodebuild -project JevJarvis.xcodeproj \
            -scheme JevJarvis \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build Keyboard Extension (unsigned)
        run: |
          xcodebuild -project JevJarvis.xcodeproj \
            -scheme JevKeyboard \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      # AltStore reads requested capabilities from each Mach-O code signature.
      # An unsigned IPA has no App Group entitlement for it to provision.
      - name: Embed entitlements for sideloading
        run: |
          set -euo pipefail
          app="build/Build/Products/Release-iphoneos/JevJarvis.app"
          keyboard="$app/PlugIns/JevKeyboard.appex"
          diagnose() {
            label="$1"
            shift
            if ! output=$("$@" 2>&1); then
              echo "::error title=$label::${output//$'\n'/ }"
              exit 1
            fi
          }
          diagnose "Sign keyboard" codesign --force --sign - --entitlements Keyboard/JevKeyboard.entitlements "$keyboard"
          diagnose "Sign app" codesign --force --sign - --entitlements App/JevJarvis.entitlements "$app"
          diagnose "Read app entitlements" bash -c 'codesign --display --entitlements - --xml "$1" > "$2"' _ "$app" "$RUNNER_TEMP/app-entitlements.plist"
          diagnose "Read keyboard entitlements" bash -c 'codesign --display --entitlements - --xml "$1" > "$2"' _ "$keyboard" "$RUNNER_TEMP/keyboard-entitlements.plist"
          diagnose "Check app group" bash -c '/usr/libexec/PlistBuddy -c "Print :com.apple.security.application-groups:0" "$1" | grep -Fx group.com.jevchat.jarvis' _ "$RUNNER_TEMP/app-entitlements.plist"
          diagnose "Check keyboard group" bash -c '/usr/libexec/PlistBuddy -c "Print :com.apple.security.application-groups:0" "$1" | grep -Fx group.com.jevchat.jarvis' _ "$RUNNER_TEMP/keyboard-entitlements.plist"

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/JevJarvis.app Payload/
          zip -r JevJarvis.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: JevJarvis-IPA
          path: JevJarvis.ipa
