name: Build iOS App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build App (unsigned)
        run: |
          xcodebuild -project JevJarvis.xcodeproj \
            -target JevJarvis \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build Keyboard Extension (unsigned)
        run: |
          xcodebuild -project JevJarvis.xcodeproj \
            -target JevKeyboard \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/JevJarvis.app Payload/
          zip -r JevJarvis.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: JevJarvis-IPA
          path: JevJarvis.ipa
